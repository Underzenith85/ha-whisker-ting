[project]
name = "ha-whisker-ting"
version = "1.3.0"
description = "Development environment for the Whisker Ting custom integration"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "msgpack==1.2.1",
    "mypy==2.3.0",
    "pycares==4.5.0",
    "pytest==8.3.4",
    "pytest-homeassistant-custom-component==0.13.199",
    "ruff==0.16.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]
# Timeout parameters are part of the stream API. The remaining SIM ignores keep
# explicit security and cancellation control flow clearer than compact rewrites.
ignore = ["ASYNC109", "SIM102", "SIM105", "SIM108", "SIM114"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "msgpack"
# msgpack does not currently publish a PEP 561 marker or bundled stubs.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "custom_components.whisker_ting.api.models",
    "custom_components.whisker_ting.auth.models",
    "custom_components.whisker_ting.auth.srp",
    "custom_components.whisker_ting.stream.models",
    "custom_components.whisker_ting.stream.signalr",
]
disallow_untyped_defs = true
disallow_untyped_calls = true
strict_equality = true
