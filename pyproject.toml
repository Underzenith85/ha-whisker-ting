[project]
name = "ha-whisker-ting"
version = "1.3.0"
description = "Development environment for the Whisker Ting custom integration"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "msgpack==1.2.1",
    "mypy==2.3.0",
    "pycares==4.5.0",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-homeassistant-custom-component==0.13.199",
    "ruff==0.16.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=custom_components/whisker_ting --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=95"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]
# Timeout parameters are part of the stream API. The remaining SIM ignores keep
# explicit security and cancellation control flow clearer than compact rewrites.
ignore = ["ASYNC109", "SIM102", "SIM105", "SIM108", "SIM114"]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "msgpack"
# msgpack does not currently publish a PEP 561 marker or bundled stubs.
ignore_missing_imports = true
