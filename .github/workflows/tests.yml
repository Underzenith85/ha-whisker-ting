name: Test suite

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install development dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --no-sync pytest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install development dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run --no-sync ruff check custom_components tests

      - name: Run staged type checks
        run: >-
          uv run --no-sync mypy
          custom_components/whisker_ting/api/models.py
          custom_components/whisker_ting/auth/models.py
          custom_components/whisker_ting/auth/srp.py
          custom_components/whisker_ting/stream/models.py
          custom_components/whisker_ting/stream/signalr.py

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall -q custom_components tests
